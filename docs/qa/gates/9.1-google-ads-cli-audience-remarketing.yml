    finding: 'A validação semântica da regra url__ CONTAINS "http" (Google aceita e interpreta como "todos os visitantes"?) não é confirmável por typecheck/unit — apenas por --dry-run real contra a API. Inerente à natureza da feature; documentado em Risks R1 e na seção Testing (smoke-test opcional).'
    suggested_action: 'Antes de rodar sem --dry-run numa conta de cliente real, executar `google-ads create audience-remarketing --name "Teste" --membership-days 90 --dry-run --customer-id <id>` contra uma conta sandbox conhecida para confirmar que a API aceita o shape do rule_based_user_list.'
  - id: 'MNT-001'
    severity: low
    finding: 'Edge case: passar `--url-contains ""` (string vazia explícita) faz o builder montar `url__ CONTAINS ""` (value = string vazia, pois `?? http` só cobre nullish), enquanto o preview e o audit-log divergem levemente na descrição. Ação improvável do operador.'
    suggested_action: 'Opcional: normalizar string vazia para o curinga "http" no builder (tratar `urlContains?.trim() || http`) para alinhar builder, preview e audit-log. Não bloqueante.'

