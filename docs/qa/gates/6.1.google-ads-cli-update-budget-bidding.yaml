    description: "mutations.ts coverage 0% via unit — funções de integração validadas via smoke"
    recommendation: "Aceito — pattern estabelecido em 5.x. Smoke real-time cobre comportamento. POST-MVP: considerar mock SDK para integration tests sem precisar de Google API."
