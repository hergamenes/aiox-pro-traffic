      AC11_post_mutate_output:
        status: PASS_VALIDATED
        evidence: "Smoke mostrou resource_name + link Ads Manager"
      AC12_audit_log:
        status: PASS_VALIDATED
        evidence: "4 entradas novas em ~/.aiox/google-ads-mutations.log com operation: pause_campaign e enable_campaign; before/after.status preenchidos"
      AC13_boundary_rule:
        status: PASS
        grep_verified: "Apenas client.ts + accounts.ts + mutations.ts importam 'google-ads-api'"
      AC14_unit_tests:
        status: PASS
        details: "24 testes novos (parseStatusEnum 9 + getTargetStatus 2 + isLearningPhase 10 + formatStatusMutationDiff 4)"
      AC15_smoke_realtime:
        status: PASS_VALIDATED
        evidence: "4 cenários executados com sucesso (dry-run + pause real + idempotência + enable rollback); audit log validado"

