storyId: "6.2"
storyTitle: "Google Ads CLI — Pause / Enable Campaign + Ad Group"
storyPath: docs/stories/6.2.google-ads-cli-pause-enable.story.md
verdict: CONCERNS
verdictRationale: |
  Implementação core 100% sólida — 14 de 15 ACs entregues com smoke
  real-time validando 4 cenários (dry-run, pause real, idempotência,
  enable rollback). 181/181 tests passing (+24 da 6.2). Veto REMOVED
  validado in vivo. Audit log gerou novos operation values
  corretamente (pause_campaign + enable_campaign).

  Bug crítico do enum CampaignStatus (3=PAUSED vs 3=REMOVED) foi
  detectado e corrigido pelo @dev durante o próprio smoke — lesson
  learned registrada nos Dev Notes ("verificar enum no .d.ts da SDK
  sempre"). Excelente self-catch.

  CONCERNS (não PASS) é registrado porque **AC#9 (learning-phase
  warning) foi deferido como POST-MVP** — helper `isLearningPhase`
  está implementado e testado (10 unit tests), mas o command não
  consome porque `campaign.start_date` não é GAQL-selectable
  conforme spec original. Trade-off técnico documentado e aceitável,
  mas constitui um AC não-cumprido conforme escrito.

  Próximo @dev (Story 6.x futura) pode resolver com 1 GAQL extra
  para `bidding_strategy_last_modification_time`.

gateDate: "2026-05-22"
gateAgent: "@qa"

checks:
  - id: 1
    name: "Code review"
    status: PASS
    findings: |
      - Handler único parameterizado em pause-enable.ts (4 commands compartilham) — boa redução de duplicação (~75%)
      - normalizeStatus + parseStatusEnum corretamente sincronizados (mesmo enum, mesma lógica)
      - Idempotência ANTES de pre-fetch da bidding info — economiza quota e UX clara
      - Cancellation cria audit log com success=false — bom para forensics
      - requireSimpleConfirm (s/N) vs requireDoubleConfirm (frase exata) bem justificado (operação reversível)
      - Comentário "Google Ads CampaignStatus enum: 2=ENABLED, 3=PAUSED, 4=REMOVED" em ambos os arquivos previne re-introdução do bug
      - JSDoc + boundary comment em mutations.ts

  - id: 2
    name: "Unit tests"
    status: PASS
    metrics:
      total_new_in_6_2: 24
      total_at_story_close: 181
      passing: 181/181
