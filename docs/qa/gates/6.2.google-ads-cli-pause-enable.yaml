        - "status-validator.ts: 100% (puro)"
        - "mutation-prompt.ts (formatStatusMutationDiff): 100%"
        - "mutations.ts (status-related funcs): ~10% via unit (validado via smoke)"

  - id: 3
    name: "Acceptance criteria"
    status: CONCERNS
    ac_status:
