storyId: "6.3c"
storyTitle: "Google Ads CLI — Campaign Create (Performance Max)"
storyPath: docs/stories/6.3c.google-ads-cli-campaign-create-pmax.story.md
verdict: CONCERNS
verdictRationale: |
  Story mais complexa do Epic 6 (8 pts) entregue com sucesso. Pipeline
  de 3-entity atomic mutateResources (Budget + Campaign + AssetGroup)
  validado via SDK validate_only. 248/248 tests passing (+19 da 6.3c).
  Lint clean. Boundary rule OK.

  PMax-specific checks implementados:
   - Conversion_action prerequisite (10 actions ENABLED encontradas no
     sandbox — veto seria ativado se 0)
   - Bidding restrito a maximize_conversion_value e target_roas
   - target_roas inside maximize_conversion_value (PMax shape correto)
   - AssetGroup criado como skeleton vazio (assets em Story 6.6)
   - Warnings PMax (canibalização + learning phase + asset missing)
   - 3 vetos pre-API validados (target_roas sem target, bidding inválido,
     final-url malformada)

  CONCERNS por DOIS motivos:
   1. Smoke real (criação) NÃO executado por escolha do user (mesmo padrão 6.3a/b)
   2. API rejeitou dry-run com "Brand Guidelines enabled — business name
      asset required" — conta Solaro tem Brand Guidelines ativado, que
      exige assets atrelados via CampaignAsset (não disponível até 6.6).
      Pipeline está correto; veto vem da configuração da conta + falta
      de Story 6.6.

  Para promover PASS: Story 6.6 deve ser implementada primeiro
  (asset upload), depois nova tentativa de smoke do 6.3c com business
  name asset anexado ANTES do create. OU: testar em conta sem Brand
  Guidelines habilitado.

gateDate: "2026-05-22"
