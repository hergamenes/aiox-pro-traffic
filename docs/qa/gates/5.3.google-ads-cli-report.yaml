      AC6_json_schema_12_keys:
        status: PASS
        clarification: "12 keys do AC implementadas exatamente (id, name, level, spend, impressions, clicks, ctr, cpc, conversions, cpa, roas, date_range). Schema-parity.test.ts congela o contrato."
      AC7_formatter: PASS  # formatTableReport + formatJson; truncate em nomes longos
      AC8_campaign_filter: PASS  # case-insensitive substring (5 tests)
      AC9_veto_conditions:
        status: PASS
        items_checked:
          - "--from sem --to (e vice-versa) → exit 1 com PT-BR"
          - "auth status inválido → exit 1"
          - "customer-id ausente sem default → exit 1 com PT-BR"
