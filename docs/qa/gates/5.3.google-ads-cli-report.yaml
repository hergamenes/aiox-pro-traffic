    dev_record_stated: "Schema canônico simplificado vs meta-ads — divergência implementada"
    qa_re_review_concluded: |
      AC#6 literal declara as 12 keys ({id, name, level, spend, impressions,
      clicks, ctr, cpc, conversions, cpa, roas, date_range}) como spec.
      @dev implementou exatamente essas 12 keys. NÃO existe deviation:
      o que parece ser deviation é comparação com meta-ads-agent ParsedMetrics
      real (que tem 22+ campos nominais), mas o AC#6 já estava simplificado
      em relação ao meta-ads real. Squad-chief deve estar ciente que squad
      consumers cruzando Meta + Google precisarão normalizer adapter — isso
      é nota do squad, não issue do CLI.
    verdict: "AC#6 = PASS sem deviation"

