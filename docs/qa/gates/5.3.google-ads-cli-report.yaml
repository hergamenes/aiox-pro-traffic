          status: PARTIAL
          rationale: "CLI funcionou tecnicamente; conta default é MCC; Google rejeitou por design"

  - id: 4
    name: "No regressions"
    status: PASS
    checks:
      - "5.1 + 5.2 tests ainda passing (101/101 inclui todos)"
