top_issues:
  - id: 'REQ-001'
    severity: low
    finding: 'Dry-run implementado como 100% client-side (não toca a API), desviando do texto literal de AC#5/#6 (que previa validate_only:true). Desvio explicitamente autorizado pela task e documentado em Completion Notes; é a opção mais segura (valida parsing/hashing sem risco). Testes confirmam ausência de chamadas de API em dry-run.'
    suggested_action: 'Nenhuma ação — desvio autorizado e mais seguro. Manter a documentação clara no --help e no output do comando.'
  - id: 'REL-001'
    severity: medium
    finding: 'Elegibilidade de política de Customer Match é dependência externa da conta (R1). A lista pode ser criada mas o match só funciona se a conta for aprovada. Erro de elegibilidade cai em PERMISSION_DENIED já mapeado. Smoke-test real com --dry-run + confirmação de elegibilidade é OBRIGATÓRIO antes do primeiro uso sem --dry-run (Open Question #1 do EPIC.md, em aberto).'
    suggested_action: 'Antes do primeiro upload real: rodar `create audience-customer-match --name "Teste CM" --from-file contatos-teste.csv --dry-run --customer-id <id>` e confirmar com o usuário se a conta de destino tem aprovação de política de Customer Match.'
  - id: 'ARCH-001'
    severity: low
    finding: 'Polling do longrunning.Operation retornado por runOfflineUserDataJob é fire-and-report (sem acompanhamento até conclusão) — decisão de escopo (R3). Status do job consultável depois via GAQL em offline_user_data_job (fora de escopo desta story).'
    suggested_action: 'Evolução futura: comando de status/polling do offline_user_data_job (nova story).'

