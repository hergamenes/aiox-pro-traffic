storyId: "6.5"
storyTitle: "Google Ads CLI — Ad Create (RSA + RDA)"
storyPath: docs/stories/6.5.google-ads-cli-ad-create-rsa-rda.story.md
verdict: CONCERNS
verdictRationale: |
  Story 6.5 entregue com sucesso — 2 subcomandos novos (`create ad rsa`
  + `create ad rda`). 287/287 tests passing (+23 da 6.5). Lint clean.
  Boundary rule OK.

  Implementação cobre:
   - Char limits client-side validados ANTES da API (lista todos os
     erros de uma vez vs Google rejeitar no primeiro)
   - 7 vetos validados via offline smoke: too few headlines, > 30 chars,
     description > 90 chars, path > 15 chars, path2 sem path1,
     non-HTTPS finalUrl, pinned not in list (RSA); empty headlines,
     business_name > 25, long_headline > 90, empty assets (RDA)
   - Asset existence check via GAQL para RDA (findMissingAssetIds)
   - Veto ad type mismatch (RSA exige Search, RDA exige Display)
   - Pinning warning amarelo
   - Status PAUSED hardcoded

  CONCERNS por:
   1. Smoke real (criação) NÃO executado (padrão 6.3 series + escolha
      conservadora do user)
   2. RDA smoke real depende de Story 6.6 (asset upload) — soft block

