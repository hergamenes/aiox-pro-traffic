top_issues:
  - id: 'REQ-001'
    severity: medium
    finding: 'A aceitação pela API v23 do update_mask "targeting_setting.target_restriction_operations" exatamente como montado não é confirmável por typecheck/unit — apenas com --dry-run (validate_only) real contra a conta. Shape 100% rastreável ao SDK (protos.d.ts, ITargetRestrictionOperation confirmado), mas o comportamento da API é um ponto de integração não exercido em ambiente sem credenciais. Inerente, documentado em Risks R1 e Completion Notes.'
    suggested_action: 'Antes de rodar sem --dry-run numa conta de cliente real, executar `google-ads create audience-target --user-list "customers/.../userLists/..." --campaign-id <id> --mode observation --dry-run --customer-id <id>` contra uma conta sandbox conhecida. Se a API rejeitar o mask, o fallback é sobrescrever target_restrictions com GAQL read prévio (follow-up story).'
  - id: 'REL-001'
    severity: low
    finding: 'Em --mode targeting, a campanha/ad group passa a servir SOMENTE ao público — pode zerar alcance de campanha ativa (R3). Já mitigado por default observation + aviso destacado no preview e reforço no output pós-sucesso; confirmação obrigatória em ambos os modos.'
    suggested_action: 'Nenhuma ação de código necessária — mitigação já implementada. Manter o aviso PT-BR visível.'

