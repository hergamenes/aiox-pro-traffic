      blocker_findings: |
        Conta default (1528041123) é Manager Account (MCC). Google não permite
        métricas em MCC por design. Para validação end-to-end com dados reais,
        usuário precisa rodar contra uma conta cliente filha da MCC. Não bloqueia
        o gate — o CLI está funcional; é uma especificidade da conta.

  critical_decisions_for_qa_review:
    schema_design:
      decision: "ParsedMetrics usa shape level-agnostic ({id, name, level, ...12 keys}) ao invés de keys nominais por nível (campaignName/adsetId/...)"
      rationale: |
        meta-ads usa nominal keys com 22+ campos; google-ads suporta 5 levels
        (account/campaign/ad_group/ad/keyword). Shape genérico permite que o
        mesmo parser sirva todos os 5 levels uniformly.
      ac6_implication: |
        AC #6 literalmente diz "AS MESMAS CHAVES que meta-ads report --format json".
        Cumprido como "schema canônico compatível" (subset de campos comuns) ao
        invés de paridade estrutural exata. Squad consumers cross-platform vão
        precisar de normalizer adapter.
      mitigation: |
        schema-parity.test.ts (5 testes CRÍTICOS) PROTEGE o contrato canônico
        declarado no arch §8. Drift internos (mudanças em ParsedMetrics) serão
        detectados imediatamente.
      qa_question_for_resolution: |
        Aceitar shape level-agnostic como nova canônica? OU
        Voltar para nominal keys (custo: parser mais complexo)? OU
        Aceitar gap e squad-chief implementa normalizer ao criar traffic-google?

    error_handler_enhancement:
      decision: "Adicionado loop em Object.values(error_code) + fallback substring match em mensagem"
      rationale: |
        Smoke revelou que codes da SDK Opteo vêm em multiple key shapes
        (query_error, authentication_error, ...). Loop é mais robusto.
      side_effect: "Nenhum negativo — todos os 101 testes ainda passam"

