      smoke_evidence: |
        Tecnicamente, o CLI:
        1. Construiu GAQL: SELECT campaign.id, campaign.name, metrics.cost_micros, ... FROM campaign WHERE segments.date DURING LAST_7_DAYS
        2. Chamou customer.query(gaql) via Opteo SDK
        3. Recebeu resposta válida do Google
        4. Google rejeitou com REQUESTED_METRICS_FOR_MANAGER (conta MCC, não cliente)
