    commit_message_suggestion: |
      feat(google-ads-agent): add pause/enable for campaign + ad_group (Story 6.2)

      Second mutation story in Epic 6, reusing the mutateResources pipeline
      from Story 6.1 to toggle campaign.status and ad_group.status between
      ENABLED and PAUSED.

      Implementation:
      - 4 new CLI subcommands: `pause campaign <id>`, `pause ad-group <id>`,
        `enable campaign <id>`, `enable ad-group <id>`
      - Single shared handler parameterized by operation+entityType+entityId
        (reduces duplication ~75%)
      - Pre-fetch obligatory before mutation (name + status + parent ctx)
      - Idempotency: skip mutate if status already matches target
      - Veto for REMOVED entities (PT-BR error)
      - --dry-run via SDK validate_only=true
      - Audit log extended with 4 new operation values (pause/enable ×
        campaign/ad_group)
      - Simple s/N confirm (reversible operation; no exact-phrase needed)
      - status-validator.ts new pure helpers (parseStatusEnum,
        getTargetStatus, isLearningPhase)

      Bug fix during smoke:
      - CampaignStatus enum was incorrectly mapped (3=REMOVED instead of
        3=PAUSED). Detected via smoke 3 (idempotency check returned false
        REMOVED). Corrected in both mutations.ts:normalizeStatus and
        status-validator.ts:parseStatusEnum + tests + Dev Notes table.
        Comment added in both files: "Google Ads CampaignStatus enum:
        2=ENABLED, 3=PAUSED, 4=REMOVED" to prevent re-introduction.

      Real-time validation:
      - Sandbox campaign 23478792639 (Solaro client account 5562216599)
      - ENABLED → PAUSED applied; idempotency check; rollback to ENABLED
      - Final state verified by QA: status=2 (ENABLED), perfectly restored

      AC#9 (learning-phase warning) deferred to POST-MVP because
      campaign.start_date is not GAQL-selectable. Helper isLearningPhase
      is implemented and unit-tested for future story to wire up.

      Stats: 181/181 tests passing (+24 in 6.2). Bundle 85.29 KB.

